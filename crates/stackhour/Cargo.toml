[package]
name = "stackhour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "stackhour — self-hosted coding-time tracker. One binary, all verbs."

[[bin]]
name = "stackhour"
path = "src/main.rs"

[dependencies]
# The shared spine. NEVER optional — every build has it.
stackhour-core.workspace = true
stackhour-store = { workspace = true, optional = true }
stackhour-server = { workspace = true, optional = true }
stackhour-agent = { workspace = true, optional = true }
stackhour-bridge = { workspace = true, optional = true }
stackhour-domain = { workspace = true, optional = true }
stackhour-hub = { workspace = true, optional = true }
stackhour-node = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde_json.workspace = true
# NOT optional: status.rs and doctor's `server_checks` both use the blocking
# client, and neither belongs to a module.
reqwest.workspace = true
rusqlite = { workspace = true, optional = true }
hostname.workspace = true
rustix.workspace = true

[features]
default = ["tracker", "agent", "bridge", "control"]
# tracker owns the server + store crates and the two rusqlite doctor checks.
tracker = ["dep:stackhour-server", "dep:stackhour-store", "dep:rusqlite"]
# stackhour-agent links rusqlite in its own right (the Zed threads.db
# snapshot), so an agent build is NOT SQLite-free. `dep:rusqlite` is listed
# here so doctor's `sqlite` check stays honest in an agent-only build.
agent = ["dep:stackhour-agent", "dep:rusqlite"]
bridge = ["dep:stackhour-bridge"]
control = [
  "dep:stackhour-domain",
  "dep:stackhour-hub",
  "dep:stackhour-node",
  "dep:stackhour-bridge",
  "dep:tokio",
]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

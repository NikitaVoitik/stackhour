# A SKILL is a capability pack: prose for the system prompt, an argument
# schema, an optional prompt template, a tool/permission policy, an optional
# default agent, and pre/post hooks. Agents list skills by name and commands
# invoke them with `kind = "skill"`.
#
# The skill's name is the DIRECTORY name — "review" — not a key in this file.
#
# EVERYTHING except `description` is optional, and every default reproduces
# the behaviour you had before skills grew these keys. A file containing only
# a description is still a perfectly good skill.

description = "Careful code review with a fixed rubric"

# Prose body, relative to this directory. Re-read whenever its mtime changes,
# so you can iterate on the wording between messages without restarting.
body = "skill.md"

# Default agent for this skill. Invoking the skill switches to it unless the
# command says otherwise. Cross-checked against agents/reviewer/.
agent = "reviewer"

# Compose other skills into this one. Their bodies are prepended in
# DEPENDENCY order (the general advice before the specialisation), deduped by
# name, and their tool policies and env are merged in the same order so this
# skill's own settings win. Cycles are detected at load and drop every skill
# on the cycle with an error naming the path.
#
#   uses = ["git-hygiene"]

# Render the turn's user prompt from a named template in prompts/ instead of
# passing the raw argument string through. The template sees every argument
# below by name, plus {{args}} (the untouched string the user typed).
#
#   template = "review"

# The argument schema. Arguments bind POSITIONALLY on whitespace, which is
# what a Telegram user actually types, and a `rest` argument swallows the
# remainder of the line verbatim so prose survives intact.
#
#   /review src/api focus on the error handling
#     -> path  = "src/api"
#        focus = "focus on the error handling"

[[args]]
name = "path"
required = true
description = "file or directory to review"

[[args]]
name = "focus"
rest = true
default = "correctness and error handling"
description = "what to pay attention to"

# Narrow what the engine may do while this skill is active. deny wins over
# allow, and composing skills can only ever TIGHTEN the policy.
[tools]
allow = ["Read", "Grep", "Glob", "Bash"]
deny = ["Write", "Edit"]

[env]
REVIEW_STRICT = "1"

# Hooks run around the turn. They are FIXED argv — never a shell string — so
# a value containing spaces, semicolons or backticks stays exactly one
# argument and can never be re-parsed as a command.
#
# Placeholders are substituted per argv element: {{arg:<name>}} for any
# declared argument, plus {{skill}}, {{agent}} and {{cwd}}.
#
# `pre` runs BEFORE the turn and a non-zero exit ABORTS it, with the hook's
# stderr sent to the chat so you can see why. `post` runs after and a non-zero
# exit is only logged.
[hooks]
pre = ["git", "diff", "--quiet", "--exit-code", "--", "{{arg:path}}"]
post = ["git", "status", "--short"]
timeout_seconds = 30

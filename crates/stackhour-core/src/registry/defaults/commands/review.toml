# /review — invoke a SKILL by name. The skill supplies the prose (its
# skill.md), its own tool policy, and optionally its own default agent; this
# file only supplies the verb and the arguments.
#
# Try:  /review src/api  focus on the error handling

description = "Review a path with the review skill"

# /rv is a shorthand. Aliases dispatch here but are not registered with
# Telegram, so they stay out of the autocomplete menu.
aliases = ["rv"]

kind = "skill"

# Names skills/review/. Cross-checked at load: if the skill is missing or was
# itself dropped for a validation error, this command is dropped too and
# `stackhour bridge doctor` names the key.
skill = "review"

# Switch to this agent before the turn. Any kind may do this, not just
# kind = "agent". Cross-checked against agents/reviewer/.
agent = "reviewer"

[[args]]
name = "path"
required = true
description = "file or directory to review"

[[args]]
name = "focus"
rest = true
description = "what to pay attention to"

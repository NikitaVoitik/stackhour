# /deploy — a worked example of the most common command shape: a prompt
# template rendered with named arguments and sent to the active engine.
#
# The file stem is the verb, so this file defines /deploy. Try:
#     /deploy staging rebuild the docker image first

description = "Run the deploy checklist"

# Extra verbs that dispatch here. They are NOT registered with Telegram
# separately, so they stay out of the autocomplete menu.
aliases = ["ship"]

# Show a Yes/Cancel keyboard before running. Worth it for anything that
# touches production.
confirm = true

# Also render as a button in /menu.
keyboard = true
button = "🚀 Deploy"

kind = "prompt"

# Names prompts/deploy.md, below. Cross-checked at load: if the template is
# missing the command is dropped and doctor tells you which key was wrong.
template = "deploy"

# Positional arguments, split on whitespace. Each one becomes a {{placeholder}}
# available to the template.
[[args]]
name = "env"
required = true
choices = ["staging", "prod"]
description = "which environment to deploy"

# `rest = true` swallows the remainder of the line verbatim, whitespace and
# all, so free text survives. At most one, and it must come last.
[[args]]
name = "note"
rest = true
description = "anything extra to tell the agent"

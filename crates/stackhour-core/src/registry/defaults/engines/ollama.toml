# An extra engine. claude and codex are built in; this shows the shape for a
# third. A file named claude.toml here would REPLACE the built-in claude
# wholesale (and keep its position in /help and the keyboard).

label = "Ollama"
emoji = "🦙"

# Binary name resolved on PATH at spawn, or an absolute path.
bin = "ollama"

# How to parse the child's stdout: "claude-stream-json" | "codex-jsonl"
# | "plain-lines".
kind = "plain-lines"

# Base argv after the binary. A trailing "-" marks the stdin sentinel: every
# flag below is spliced in JUST BEFORE it, which is what keeps argv order
# stable no matter which options are active.
args = ["run", "llama3", "-"]

# How the user prompt reaches the child: "stdin" or "last-arg".
prompt = "stdin"

# Resuming a session. Exactly one of the two forms:
#   [resume] flag = ["--resume", "{{session_id}}"]      # append flags
#   [resume] subcommand = "resume"                       # insert a subcommand
# Omit the table entirely for an engine with no resume support.

# Optional flag templates. Each is spliced only when the corresponding value
# is actually set, so an engine never sees an empty --model.
# model_args  = ["--model", "{{model}}"]
# effort_args = ["--reasoning-effort", "{{effort}}"]

[env]
OLLAMA_KEEP_ALIVE = "30m"

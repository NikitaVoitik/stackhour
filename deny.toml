[advisories]
db-path = ".cache/advisory-db"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
# These versions are fixed transitive splits in current upstream crates. Any
# new duplicate version fails until it is reviewed and listed here.
skip = [
  { crate = "getrandom@0.2.17", reason = "ring still uses getrandom 0.2" },
  { crate = "getrandom@0.3.4", reason = "rand_core 0.9 still uses getrandom 0.3" },
  { crate = "hashbrown@0.14.5", reason = "rusqlite uses hashlink with hashbrown 0.14" },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3 uses r-efi 5" },
  { crate = "syn@3.0.0", reason = "new proc macros are migrating from syn 2 to syn 3" },
  { crate = "windows-sys@0.52.0", reason = "ring supports an older Windows API crate" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

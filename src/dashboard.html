<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stackhour</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --text:#e6e9ef; --dim:#8b93a3; --accent:#7aa2f7; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; padding:24px; max-width:1100px; margin:0 auto; }
  h1 { font-size:20px; margin-bottom:4px; } h1 span { color:var(--accent); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 12px; }
  .sub { color:var(--dim); margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  .card { background:var(--card); border-radius:10px; padding:16px 18px; }
  .big { font-size:34px; font-weight:600; margin:4px 0 2px; }
  .row { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .row .name { width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .bar { flex:1; height:8px; background:#232735; border-radius:4px; overflow:hidden; }
  .row .bar i { display:block; height:100%; border-radius:4px; }
  .row .val { width:64px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  .days { display:flex; align-items:flex-end; gap:4px; height:120px; margin-top:8px; }
  .days .col { flex:1; display:flex; flex-direction:column-reverse; gap:1px; }
  .days .col div { border-radius:2px; min-height:1px; }
  .days-labels { display:flex; gap:4px; margin-top:6px; }
  .days-labels span { flex:1; text-align:center; color:var(--dim); font-size:10px; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12px; color:var(--dim); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:3px 6px; border-top:1px solid #232735; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
  select { background:var(--card); color:var(--text); border:1px solid #2a2f3d; border-radius:6px; padding:4px 8px; }
  .controls { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .split { display:flex; gap:14px; margin:2px 0 4px; font-size:13px; }
  .split .you::before { content:'you '; color:var(--dim); }
  .split .agents::before { content:'agents '; color:var(--dim); }
  .split .you { color:#9ece6a; } .split .agents { color:#bb9af7; }
  .split .cost { color:#e0af68; }
  .now-line { margin:4px 0; font-size:13px; }
  .now-line .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
  .row .cost { width:56px; text-align:right; color:#e0af68; font-size:11px; font-variant-numeric:tabular-nums; }
  .lane { display:flex; align-items:center; gap:10px; margin:4px 0; }
  .lane .name { width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .lane .track { flex:1; position:relative; height:16px; background:#1c202b; border-radius:4px; }
  .lane .track i { position:absolute; top:0; height:100%; border-radius:3px; min-width:2px; }
</style>
</head>
<body>
<h1><span>stackhour</span> — coding time</h1>
<p class="sub" id="updated">loading…</p>
<div class="controls">
  range <select id="range"><option value="1">today</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="90">90 days</option></select>
  split by <select id="groupBy"><option value="project" selected>project</option><option value="source">source</option><option value="machine">machine</option><option value="actor">actor</option><option value="category">category</option><option value="language">language</option></select>
</div>
<div class="grid">
  <div class="card"><h2>Total</h2><div class="big" id="total">–</div>
    <div class="split"><span class="you" id="humanTotal">–</span><span class="agents" id="agentTotal">–</span><span class="cost" id="totalCost"></span></div>
    <div class="sub" id="totalNote"></div></div>
  <div class="card"><h2>Now</h2><div id="now" class="sub">–</div></div>
  <div class="card"><h2 id="splitTitle">By project</h2><div id="totals"></div></div>
  <div class="card" style="grid-column:1/-1"><h2>Timeline (last 24h) — bright = you, dim = agents</h2>
    <div id="timeline"></div></div>
  <div class="card" style="grid-column:1/-1"><h2>Per day</h2><div class="days" id="days"></div><div class="days-labels" id="dayLabels"></div><div class="legend" id="legend"></div></div>
  <div class="card" style="grid-column:1/-1"><h2>Recent heartbeats</h2><table id="recent"></table></div>
</div>
<script>
const COLORS = ['#7aa2f7','#9ece6a','#e0af68','#f7768e','#bb9af7','#7dcfff','#ff9e64','#73daca','#c0caf5','#565f89'];
const fmt = s => s >= 3600 ? `${Math.floor(s/3600)}h ${Math.round(s%3600/60)}m` : `${Math.round(s/60)}m`;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
})[c]);

async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function showError(err) {
  document.getElementById('updated').textContent = `refresh failed: ${err.message}`;
}

async function load() {
  const days = document.getElementById('range').value;
  const groupBy = document.getElementById('groupBy').value;
  const tz = new Date().getTimezoneOffset();
  const [s, recent, tl, now] = await Promise.all([
    getJson(`/api/summary?days=${days}&groupBy=${groupBy}&tz=${tz}`),
    getJson('/api/recent?limit=30'),
    getJson('/api/timeline?hours=24'),
    getJson('/api/now'),
  ]);

  document.getElementById('updated').textContent = `updated ${new Date().toLocaleTimeString()}`;
  document.getElementById('total').textContent = fmt(s.total);
  document.getElementById('humanTotal').textContent = fmt(s.humanTotal || 0);
  document.getElementById('agentTotal').textContent = fmt(s.agentTotal || 0);
  document.getElementById('totalCost').textContent = s.totalCost ? `$${s.totalCost.toFixed(2)} api-equiv` : '';

  document.getElementById('now').innerHTML = now.length
    ? now.map(n =>
      `<div class="now-line"><span class="dot" style="background:${n.actor==='agent'?'#bb9af7':'#9ece6a'}"></span>` +
      `${n.actor === 'agent' ? '🤖' : '🧑'} <b>${esc(n.project)}</b> · ${esc(n.source)} · ${esc(n.machine)}</div>`).join('')
    : 'nothing active';

  // timeline lanes: one row per project; bright segments = human, dim = agent
  const laneProjects = [...new Set(tl.segments.map(x => x.project))];
  const span = tl.to - tl.from;
  const laneColor = Object.create(null);
  laneProjects.forEach((p, i) => laneColor[p] = COLORS[i % COLORS.length]);
  document.getElementById('timeline').innerHTML = laneProjects.map(p => {
    const segs = tl.segments.filter(x => x.project === p);
    return `<div class="lane"><div class="name" title="${esc(p)}">${esc(p)}</div><div class="track">` +
      segs.map(x => {
        const left = 100 * (x.start - tl.from) / span;
        const width = Math.max(0.3, 100 * (x.end - x.start) / span);
        const t = d => new Date(d*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        return `<i style="left:${left}%;width:${width}%;background:${laneColor[p]};opacity:${x.actor==='agent'?0.35:1}"
          title="${esc(x.actor)} · ${t(x.start)}–${t(x.end)} · ${fmt(x.seconds)} · ${esc(x.sources.join(', '))}"></i>`;
      }).join('') + '</div></div>';
  }).join('') || '<div class="sub">no activity in the last 24h</div>';
  document.getElementById('totalNote').textContent = days == 1 ? 'today' : `last ${days} days`;
  document.getElementById('splitTitle').textContent = 'By ' + groupBy;

  // totals bars
  const totals = s.totals.slice(0, 12);
  const max = totals[0]?.seconds || 1;
  const color = Object.create(null);
  totals.forEach((t, i) => color[t[groupBy]] = COLORS[i % COLORS.length]);
  document.getElementById('totals').innerHTML = totals.map(t =>
    `<div class="row"><div class="name" title="${esc(t[groupBy])}">${esc(t[groupBy])}</div>
     <div class="bar"><i style="width:${100*t.seconds/max}%;background:${color[t[groupBy]]}"></i></div>
     <div class="val">${fmt(t.seconds)}</div>
     <div class="cost">${t.cost >= 0.01 ? '$'+t.cost.toFixed(2) : ''}</div></div>`).join('');

  // per-day stacked columns
  const byDate = Object.create(null);
  for (const d of s.days) (byDate[d.date] ||= []).push(d);
  const dates = [];
  for (let i = days - 1; i >= 0; i--) {
    // Match the same local-day shift sent to dayBuckets on the server.
    dates.push(new Date(Date.now() - i * 86400000 - tz * 60000).toISOString().slice(0, 10));
  }
  const dayMax = Math.max(1, ...dates.map(d => (byDate[d] || []).reduce((a, x) => a + x.seconds, 0)));
  document.getElementById('days').innerHTML = dates.map(d => {
    const parts = (byDate[d] || []).sort((a, b) => b.seconds - a.seconds);
    return `<div class="col" title="${d}: ${fmt(parts.reduce((a,x)=>a+x.seconds,0))}">` +
      parts.map(p => `<div style="height:${100*p.seconds/dayMax}%;background:${color[p[groupBy]]||'#3b4261'}"></div>`).join('') +
      '</div>';
  }).join('');
  document.getElementById('dayLabels').innerHTML = dates.map(d =>
    `<span>${days <= 14 ? d.slice(5) : ''}</span>`).join('');
  document.getElementById('legend').innerHTML = totals.slice(0, 10).map(t =>
    `<span><i style="background:${color[t[groupBy]]}"></i>${esc(t[groupBy])}</span>`).join('');

  document.getElementById('recent').innerHTML = recent.map(r =>
    `<tr><td>${new Date(r.time*1000).toLocaleTimeString()}</td><td>${esc(r.machine)}</td><td>${esc(r.source)}</td>
     <td>${esc(r.project)}</td><td title="${esc(r.entity)}">${esc(r.entity.split('/').pop())}</td><td>${esc(r.category)}</td></tr>`).join('');
}
document.getElementById('range').onchange = () => load().catch(showError);
document.getElementById('groupBy').onchange = () => load().catch(showError);
load().catch(showError);
setInterval(() => load().catch(showError), 60000);
</script>
</body>
</html>

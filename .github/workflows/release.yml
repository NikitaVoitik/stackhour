name: Release installers

on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^version = / {
              gsub(/^version = "|".*$/, "")
              print
              exit
            }
            section && /^\[/ { exit }
          ' Cargo.toml)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid workspace version: $version" >&2
            exit 1
          fi
          tag="v$version"
          release=true
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ]; then
            previous=$(git show "$BEFORE_SHA:Cargo.toml" 2>/dev/null | awk '
              $0 == "[workspace.package]" { section = 1; next }
              section && /^version = / {
                gsub(/^version = "|".*$/, "")
                print
                exit
              }
              section && /^\[/ { exit }
            ')
            if [ "$previous" = "$version" ]; then
              release=false
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            release=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [version, test]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            flavor: full
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            flavor: full
          - runner: macos-15
            target: aarch64-apple-darwin
            flavor: full
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            flavor: bridge
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            flavor: bridge
          - runner: macos-15
            target: aarch64-apple-darwin
            flavor: bridge
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup target add "${{ matrix.target }}"
      - name: Build release binary
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          if [ "$FLAVOR" = bridge ]; then
            cargo build --locked --release -p stackhour --target "${{ matrix.target }}" \
              --no-default-features --features bridge
          else
            cargo build --locked --release -p stackhour --target "${{ matrix.target }}"
          fi
      - name: Package installer
        env:
          TARGET: ${{ matrix.target }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          prefix=stackhour
          [ "$FLAVOR" = full ] || prefix="stackhour-$FLAVOR"
          package="$prefix-$TARGET"
          mkdir -p "package/$package" dist
          cp "target/$TARGET/release/stackhour" "package/$package/stackhour"
          cp deploy/install.sh "package/$package/install.sh"
          cp LICENSE README.md "package/$package/"
          chmod 0755 "package/$package/stackhour" "package/$package/install.sh"
          tar -C package -czf "dist/$package.tar.gz" "$package"
      - name: Smoke-test static Linux artifact on supported distributions
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          prefix=stackhour
          [ "$FLAVOR" = full ] || prefix="stackhour-$FLAVOR"
          binary="$PWD/package/$prefix-$TARGET/stackhour"
          docker run --rm -v "$binary:/stackhour:ro" debian:12 /stackhour
          docker run --rm -v "$binary:/stackhour:ro" amazonlinux:2023 /stackhour
      - name: Validate generated systemd service contracts
        if: runner.os == 'Linux'
        run: |
          units="$PWD/deploy/systemd"
          docker run --rm -v "$units:/units:ro" debian:12 sh -c \
            'apt-get update && apt-get install --yes systemd && systemd-analyze verify /units/*.service'
          docker run --rm -v "$units:/units:ro" amazonlinux:2023 sh -c \
            'systemd-analyze verify /units/*.service'
      - uses: actions/upload-artifact@v7
        with:
          name: stackhour-${{ matrix.flavor }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Test ${{ matrix.runner }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace --all-features

  publish:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: stackhour-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cp deploy/install.sh dist/install-stackhour.sh
          cd dist
          sha256sum stackhour-*.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > VERSION
      - name: Create GitHub release
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Stackhour $VERSION" \
            --generate-notes

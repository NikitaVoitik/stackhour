[package]
name = "stackhour-bench-vue-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
benchmark-core = { path = "../crates/benchmark-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[workspace]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[package]
name = "stackhour-bench-dioxus-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
benchmark-core = { path = "../crates/benchmark-core" }
dioxus = { version = "=0.7.2", features = ["desktop"] }
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[workspace]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[advisories]
db-path = ".cache/advisory-db"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "MIT",
  "NCSA",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "getrandom@0.2.17", reason = "stackhour-core and ring use getrandom 0.2" },
  { crate = "hashbrown@0.14.5", reason = "rusqlite uses hashlink with hashbrown 0.14" },
  { crate = "syn@3.0.3", reason = "new proc macros are migrating from syn 2 to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[package]
name = "stackhour-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"
repository = "https://github.com/NikitaVoitik/stackhour"
readme = "../README.md"
keywords = ["coding-time", "productivity", "self-hosted", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
stackhour-domain = { path = "../crates/stackhour-domain" }

[[bin]]
name = "protocol_messages"
path = "fuzz_targets/protocol_messages.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
